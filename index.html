<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenfoco</title>
<meta name="theme-color" content="#7cc4f0">
<meta name="description" content="Zenfoco: pomodoro para concentrarte mejor.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#eaf6ff; --card:#ffffff; --text:#12324a; --muted:#5f7f97;
  --accent:#3aa7e8; --accent-dark:#1f86c6; --ring-bg:#d3e9f7; --break:#4cc2a5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a26; --card:#13273a; --text:#e6f3fc; --muted:#8fb0c7;
    --accent:#5bb8f0; --accent-dark:#3aa7e8; --ring-bg:#1d3a52; --break:#47b99c;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a26; --card:#13273a; --text:#e6f3fc; --muted:#8fb0c7;
  --accent:#5bb8f0; --accent-dark:#3aa7e8; --ring-bg:#1d3a52; --break:#47b99c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
}
header{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:1.3rem;margin:0;letter-spacing:.5px}
.icon-btn{background:var(--card);color:var(--text);border:0;border-radius:12px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
main{width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;align-items:center;gap:20px}
.modes{display:flex;gap:8px;background:var(--card);padding:6px;border-radius:16px;width:100%}
.modes button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer}
.modes button.active{background:var(--accent);color:#fff}
.timer{position:relative;width:min(78vw,300px);aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring-bg{stroke:var(--ring-bg)}
.ring{stroke:var(--accent);transition:stroke-dashoffset .4s linear,stroke .3s}
body.break .ring{stroke:var(--break)}
.time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time .digits{font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.time .label{color:var(--muted);font-size:.95rem;margin-top:4px}
.controls{display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:16px;padding:14px 32px;font-size:1.1rem;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn:active{background:var(--accent-dark)}
.btn.secondary{background:var(--card);color:var(--text);padding:14px 20px}
.stats{width:100%;background:var(--card);border-radius:16px;padding:14px 18px;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:1.5rem}
.stats span{color:var(--muted);font-size:.8rem}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--text);width:min(92vw,380px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 14px;font-size:1.15rem}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:12px}
.row input[type=number]{width:80px;padding:8px;border-radius:10px;border:1px solid var(--ring-bg);background:var(--bg);color:var(--text);font-size:1rem}
.row select{padding:8px;border-radius:10px;border:1px solid var(--ring-bg);background:var(--bg);color:var(--text);font-size:1rem}
.row input[type=checkbox]{width:22px;height:22px}
.dlg-actions{display:flex;justify-content:flex-end;margin-top:16px}
#install{display:none;font-size:.9rem;padding:10px 18px}
.sounds{width:100%;background:var(--card);border-radius:16px;padding:14px 18px}
.sounds h2{margin:0 0 10px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:10px 14px;background:var(--bg);color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.vol{display:flex;align-items:center;gap:10px;margin-top:14px}
.vol input{flex:1;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:.8rem;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <h1>🌤️ Zenfoco</h1>
  <button class="icon-btn" id="openSettings" aria-label="Ajustes">⚙️</button>
</header>
<main>
  <div class="modes" role="tablist">
    <button data-mode="focus" class="active">Enfoque</button>
    <button data-mode="short">Descanso</button>
    <button data-mode="long">Descanso largo</button>
  </div>

  <div class="timer">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
      <circle class="ring" id="ring" cx="60" cy="60" r="52"></circle>
    </svg>
    <div class="time">
      <div class="digits" id="digits" aria-live="off">25:00</div>
      <div class="label" id="label">Hora de concentrarse</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn secondary" id="reset" aria-label="Reiniciar">↺</button>
    <button class="btn" id="start">Empezar</button>
    <button class="btn secondary" id="skip" aria-label="Saltar">⏭</button>
  </div>

  <div class="stats">
    <div><b id="statToday">0</b><span>Hoy</span></div>
    <div><b id="statMinutes">0</b><span>Minutos</span></div>
    <div><b id="statStreak">0</b><span>Racha (días)</span></div>
  </div>

  <section class="sounds">
    <h2>🎧 Sonidos de concentración</h2>
    <div class="chips" id="chips">
      <button class="chip" data-sound="rain">🌧️ Lluvia</button>
      <button class="chip" data-sound="sea">🌊 Mar</button>
      <button class="chip" data-sound="brown">🟤 Ruido marrón</button>
      <button class="chip" data-sound="pink">🌸 Ruido rosa</button>
      <button class="chip" data-sound="white">⚪ Ruido blanco</button>
    </div>
    <div class="vol">
      <span aria-hidden="true">🔈</span>
      <input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Volumen">
      <span aria-hidden="true">🔊</span>
    </div>
    <p class="hint">Pulsa un sonido para activarlo y vuelve a pulsarlo para apagarlo.</p>
  </section>

  <button class="btn secondary" id="install">📲 Instalar Zenfoco</button>
</main>

<dialog id="settings">
  <h2>Ajustes</h2>
  <div class="row"><label for="sFocus">Enfoque (min)</label><input type="number" id="sFocus" min="1" max="180"></div>
  <div class="row"><label for="sShort">Descanso (min)</label><input type="number" id="sShort" min="1" max="60"></div>
  <div class="row"><label for="sLong">Descanso largo (min)</label><input type="number" id="sLong" min="1" max="90"></div>
  <div class="row"><label for="sEvery">Descanso largo cada</label><input type="number" id="sEvery" min="2" max="10"></div>
  <div class="row"><label for="sAuto">Iniciar siguiente automáticamente</label><input type="checkbox" id="sAuto"></div>
  <div class="row"><label for="sSound">Sonido al terminar</label><input type="checkbox" id="sSound"></div>
  <div class="row"><label for="sTheme">Tema</label>
    <select id="sTheme"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select>
  </div>
  <div class="dlg-actions"><button class="btn" id="saveSettings">Guardar</button></div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  const defaults = { focus:25, short:5, long:15, every:4, auto:false, sound:true, theme:'auto' };
  let settings = Object.assign({}, defaults, store.get('zf_settings', {}));
  let stats = store.get('zf_stats', { days:{} }); // { days: { 'YYYY-MM-DD': {n, min} } }

  let mode = 'focus', cycle = 0;
  let total = settings.focus * 60, remaining = total;
  let running = false, endAt = 0, tick = null;

  const labels = { focus:'Hora de concentrarse', short:'Respira un momento', long:'Descanso largo, te lo has ganado' };
  const R = 52, C = 2 * Math.PI * R;
  const ring = $('ring');
  ring.style.strokeDasharray = C;

  function applyTheme(){
    if (settings.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', settings.theme);
  }

  function fmt(s){
    const m = Math.floor(s / 60), r = s % 60;
    return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }

  function render(){
    $('digits').textContent = fmt(remaining);
    $('label').textContent = labels[mode];
    ring.style.strokeDashoffset = C * (1 - remaining / total);
    $('start').textContent = running ? 'Pausar' : (remaining < total ? 'Seguir' : 'Empezar');
    document.body.classList.toggle('break', mode !== 'focus');
    document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.title = running ? fmt(remaining) + ' · Zenfoco' : 'Zenfoco';
  }

  function dayKey(d = new Date()){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
  }

  function renderStats(){
    const t = stats.days[dayKey()] || { n:0, min:0 };
    $('statToday').textContent = t.n;
    $('statMinutes').textContent = t.min;
    let streak = 0, d = new Date();
    if (!stats.days[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (stats.days[dayKey(d)] && stats.days[dayKey(d)].n > 0){ streak++; d.setDate(d.getDate() - 1); }
    $('statStreak').textContent = streak;
  }

  function setMode(m){
    mode = m;
    total = settings[m] * 60;
    remaining = total;
    stop();
    render();
  }

  function stop(){
    running = false;
    clearInterval(tick); tick = null;
    releaseWake();
  }

  function start(){
    if (running) return;
    running = true;
    endAt = Date.now() + remaining * 1000;
    tick = setInterval(update, 250);
    requestWake();
    render();
  }

  function update(){
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    render();
    if (remaining <= 0) finish();
  }

  function finish(){
    stop();
    if (mode === 'focus'){
      const k = dayKey();
      const t = stats.days[k] || { n:0, min:0 };
      t.n += 1; t.min += settings.focus;
      stats.days[k] = t;
      store.set('zf_stats', stats);
      cycle++;
      renderStats();
    }
    notify();
    beep();
    const next = mode === 'focus' ? (cycle % settings.every === 0 ? 'long' : 'short') : 'focus';
    setMode(next);
    if (settings.auto) start();
  }

  function beep(){
    if (!settings.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach((delay, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 660 + i * 110;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.22);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.25);
      });
    } catch(e){}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  function notify(){
    try {
      if ('Notification' in window && Notification.permission === 'granted'){
        const msg = mode === 'focus' ? '¡Sesión completada! Toca descansar.' : 'Descanso terminado. ¡A concentrarse!';
        navigator.serviceWorker.getRegistration().then(reg => {
          if (reg) reg.showNotification('Zenfoco', { body: msg, icon: 'icon-192.png', tag: 'zenfoco' });
          else new Notification('Zenfoco', { body: msg, icon: 'icon-192.png' });
        });
      }
    } catch(e){}
  }

  // Mantener pantalla encendida mientras corre
  let wake = null;
  async function requestWake(){
    try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){}
  }
  function releaseWake(){
    try { if (wake){ wake.release(); wake = null; } } catch(e){}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running){ update(); requestWake(); }
  });

  // Eventos
  $('start').addEventListener('click', () => {
    if (running){ stop(); render(); }
    else {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
      start();
    }
  });
  $('reset').addEventListener('click', () => { setMode(mode); });
  $('skip').addEventListener('click', () => {
    const next = mode === 'focus' ? (((cycle + 1) % settings.every === 0) ? 'long' : 'short') : 'focus';
    setMode(next);
  });
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // Ajustes
  const dlg = $('settings');
  $('openSettings').addEventListener('click', () => {
    $('sFocus').value = settings.focus; $('sShort').value = settings.short; $('sLong').value = settings.long;
    $('sEvery').value = settings.every; $('sAuto').checked = settings.auto; $('sSound').checked = settings.sound;
    $('sTheme').value = settings.theme;
    dlg.showModal();
  });
  $('saveSettings').addEventListener('click', () => {
    const num = (id, min, max, d) => { const v = parseInt($(id).value, 10); return isNaN(v) ? d : Math.min(max, Math.max(min, v)); };
    settings.focus = num('sFocus', 1, 180, 25);
    settings.short = num('sShort', 1, 60, 5);
    settings.long = num('sLong', 1, 90, 15);
    settings.every = num('sEvery', 2, 10, 4);
    settings.auto = $('sAuto').checked;
    settings.sound = $('sSound').checked;
    settings.theme = $('sTheme').value;
    store.set('zf_settings', settings);
    applyTheme();
    dlg.close();
    setMode(mode);
  });

  // Instalación
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e; $('install').style.display = 'inline-block';
  });
  $('install').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null; $('install').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => { $('install').style.display = 'none'; });

  // Service worker
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // ---------- Sonidos de concentración (generados en el dispositivo) ----------
  const SOUND_NAMES = { rain:'Lluvia', sea:'Mar', brown:'Ruido marrón', pink:'Ruido rosa', white:'Ruido blanco' };
  const soundUrls = {};
  const player = new Audio();
  player.loop = true;
  let currentSound = null;
  let volume = store.get('zf_volume', 0.6);

  function makeWav(kind){
    const sr = 22050, L = sr * 16, F = sr * 2, N = L + F;
    const x = new Float32Array(N);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0, last=0, lp=0, lp2=0, hpY=0, prevLp=0, env=0;
    for (let i = 0; i < N; i++){
      const w = Math.random() * 2 - 1;
      if (kind === 'white'){
        x[i] = w * 0.5;
      } else if (kind === 'pink'){
        b0 = .99886*b0 + w*.0555179; b1 = .99332*b1 + w*.0750759; b2 = .96900*b2 + w*.1538520;
        b3 = .86650*b3 + w*.3104856; b4 = .55000*b4 + w*.5329522; b5 = -.7616*b5 - w*.0168980;
        x[i] = (b0+b1+b2+b3+b4+b5+b6 + w*.5362) * 0.11;
        b6 = w * .115926;
      } else if (kind === 'brown'){
        last = (last + 0.02 * w) / 1.02;
        x[i] = last * 3.5;
      } else if (kind === 'rain'){
        lp += 0.6 * (w - lp);
        hpY = 0.97 * (hpY + lp - prevLp); prevLp = lp;
        if (Math.random() < 0.0006) env = 0.3 + Math.random() * 0.5;
        env *= 0.992;
        x[i] = hpY * 0.5 + env * w * 0.4;
      } else if (kind === 'sea'){
        lp += 0.05 * (w - lp);
        lp2 += 0.35 * (w - lp2);
        const t = i / sr;
        const swell = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 8 - 1.2);
        const e = 0.25 + 0.75 * swell * swell;
        x[i] = lp * e * 3.2 + lp2 * e * e * 0.22;
      }
    }
    // Bucle sin cortes: mezclar el final con el principio
    const out = new Float32Array(L);
    for (let i = 0; i < L; i++) out[i] = x[i];
    for (let i = 0; i < F; i++){
      const a = i / F;
      out[i] = x[i] * a + x[L + i] * (1 - a);
    }
    let peak = 0.0001, sq = 0;
    for (let i = 0; i < L; i++){ const v = Math.abs(out[i]); if (v > peak) peak = v; sq += out[i] * out[i]; }
    const rms = Math.sqrt(sq / L) || 0.0001;
    const scale = Math.min(0.9 / peak, 0.12 / rms);
    // WAV 16 bit mono
    const buf = new ArrayBuffer(44 + L * 2);
    const dv = new DataView(buf);
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); dv.setUint32(4, 36 + L * 2, true); wr(8, 'WAVE'); wr(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    wr(36, 'data'); dv.setUint32(40, L * 2, true);
    for (let i = 0; i < L; i++){
      const v = Math.max(-1, Math.min(1, out[i] * scale));
      dv.setInt16(44 + i * 2, v * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  function renderSounds(){
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.sound === currentSound));
  }

  function stopSound(){
    try { player.pause(); } catch(e){}
    currentSound = null;
    renderSounds();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
  }

  function playSound(kind){
    if (currentSound === kind){ stopSound(); return; }
    if (!soundUrls[kind]) soundUrls[kind] = makeWav(kind);
    player.src = soundUrls[kind];
    player.volume = volume;
    player.play().catch(() => {});
    currentSound = kind;
    renderSounds();
    if ('mediaSession' in navigator){
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: SOUND_NAMES[kind], artist: 'Zenfoco',
          artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
        });
        navigator.mediaSession.setActionHandler('pause', stopSound);
        navigator.mediaSession.setActionHandler('stop', stopSound);
        navigator.mediaSession.playbackState = 'playing';
      } catch(e){}
    }
  }

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => playSound(c.dataset.sound)));
  const volEl = $('vol');
  volEl.value = volume;
  volEl.addEventListener('input', () => {
    volume = parseFloat(volEl.value);
    player.volume = volume;
    store.set('zf_volume', volume);
  });

  applyTheme(); render(); renderStats();
})();
</script>
</body>
</html>
